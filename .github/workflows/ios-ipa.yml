name: Build iOS .ipa

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "Тип сборки"
        type: choice
        default: unsigned
        options: [unsigned, development, ad-hoc, app-store, enterprise]
      app_id:
        description: "Bundle Identifier"
        type: string
        default: ru.dnevnik.app
      xcode_version:
        description: "Версия Xcode"
        type: string
        default: "15.4"
  push:
    branches: [main, master]
    paths:
      - "index.html"
      - ".github/workflows/ios-ipa.yml"
      - "scripts/**"

permissions:
  contents: read

jobs:
  build:
    name: Capacitor -> Xcode archive -> .ipa
    runs-on: macos-14
    timeout-minutes: 60

    env:
      APP_ID: ${{ inputs.app_id || 'ru.dnevnik.app' }}
      APP_NAME: "Дневник"
      APP_NAME_LATIN: Dnevnik
      EXPORT_METHOD: ${{ inputs.export_method || 'unsigned' }}
      XCODE_MAJOR: ${{ inputs.xcode_version || '15.4' }}
      WEB_DIR: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Проверить, что index.html на месте
        run: |
          test -f index.html || { echo "::error::index.html не найден в корне репозитория"; exit 1; }
          echo "размер index.html: $(wc -c < index.html) байт"

      - name: Выбрать Xcode
        run: |
          if [ -d "/Applications/Xcode_$XCODE_MAJOR.app" ]; then
            sudo xcode-select -switch "/Applications/Xcode_$XCODE_MAJOR.app"
          fi
          xcodebuild -version
          xcode-select -p

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: CocoaPods
        run: |
          pod --version || (sudo gem install cocoapods --no-document && pod --version)

      - name: Кэш CocoaPods и npm
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.npm
            ios/App/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-v1
          restore-keys: pods-${{ runner.os }}-

      - name: Импорт сертификата и профиля (для подписанных сборок)
        if: env.EXPORT_METHOD != 'unsigned'
        env:
          IPA_SIGNING_KEY_BASE64: ${{ secrets.IPA_SIGNING_KEY_BASE64 }}
          IPA_SIGNING_KEY_PASSWORD: ${{ secrets.IPA_SIGNING_KEY_PASSWORD }}
          IPA_PROVISIONING_PROFILE_BASE64: ${{ secrets.IPA_PROVISIONING_PROFILE_BASE64 }}
        run: bash scripts/ci-build-ios.sh sign

      - name: Скаффолд Capacitor из index.html
        run: bash scripts/ci-build-ios.sh init

      - name: Архив (xcodebuild archive)
        run: bash scripts/ci-build-ios.sh archive

      - name: Упаковать .ipa
        run: |
          if [ "$EXPORT_METHOD" = "unsigned" ]; then
            bash scripts/ci-build-ios.sh package
          else
            bash scripts/ci-build-ios.sh export
          fi

      - name: Собрать список артефактов
        run: |
          mkdir -p out
          cp build/ipa/*.ipa out/ 2>/dev/null || true
          if [ "$EXPORT_METHOD" = "unsigned" ]; then
            ditto -c -k --sequesterRsrc --keepParent build/App.xcarchive out/App.xcarchive.zip
          fi
          ls -lh out

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ env.EXPORT_METHOD }}-${{ github.run_number }}
          path: out/
          if-no-files-found: error

      - name: Xcode-логи при ошибке
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs-${{ github.run_number }}
          path: |
            ~/Library/Logs/xcodebuild
            build/*.log
          if-no-files-found: ignore
          # trigger
