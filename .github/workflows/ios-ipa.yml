name: Build iOS .ipa

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "Тип сборки"
        type: choice
        default: unsigned
        options: [unsigned, development, ad-hoc, app-store, enterprise]
      app_id:
        description: "Bundle Identifier"
        type: string
        default: ru.dnevnik.app
      xcode_version:
        description: "Версия Xcode ('auto' = предустановленная)"
        type: string
        default: "auto"
      runner:
        description: "Раннер"
        type: choice
        default: macos-15
        options: [macos-15, macos-latest, macos-15-intel]

permissions:
  contents: read

jobs:
  build:
    name: Capacitor -> Xcode archive -> .ipa
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 90

    env:
      APP_ID: ${{ inputs.app_id || 'ru.dnevnik.app' }}
      APP_NAME: "Дневник"
      APP_NAME_LATIN: Dnevnik
      EXPORT_METHOD: ${{ inputs.export_method || 'unsigned' }}
      XCODE_MAJOR: ${{ inputs.xcode_version || 'auto' }}
      CAP_VERSION: "7"
      WEB_DIR: .

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Проверить index.html
        run: |
          test -f index.html || { echo "::error::index.html не найден в корне репозитория"; exit 1; }
          echo "index.html: $(wc -c < index.html) байт"

      - name: Диагностика окружения
        run: bash scripts/ci-build-ios.sh env

      - name: Выбрать Xcode
        run: |
          ls /Applications | grep -i '^Xcode' || true
          if [ "$XCODE_MAJOR" != "auto" ] && [ -d "/Applications/Xcode_$XCODE_MAJOR.app" ]; then
            sudo xcode-select -switch "/Applications/Xcode_$XCODE_MAJOR.app"
          fi
          xcodebuild -version
          xcode-select -p

      - name: Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: CocoaPods
        run: bash scripts/ci-build-ios.sh pod

      - name: Импорт сертификата и профиля (для подписанных сборок)
        if: env.EXPORT_METHOD != 'unsigned'
        env:
          IPA_SIGNING_KEY_BASE64: ${{ secrets.IPA_SIGNING_KEY_BASE64 }}
          IPA_SIGNING_KEY_PASSWORD: ${{ secrets.IPA_SIGNING_KEY_PASSWORD }}
          IPA_PROVISIONING_PROFILE_BASE64: ${{ secrets.IPA_PROVISIONING_PROFILE_BASE64 }}
        run: bash scripts/ci-build-ios.sh sign

      - name: Скаффолд Capacitor из index.html
        run: bash scripts/ci-build-ios.sh init

      - name: Архив (xcodebuild archive)
        run: bash scripts/ci-build-ios.sh archive

      - name: Упаковать .ipa
        run: |
          if [ "$EXPORT_METHOD" = "unsigned" ]; then
            bash scripts/ci-build-ios.sh package
          else
            bash scripts/ci-build-ios.sh export
          fi

      - name: Собрать артефакты
        if: success()
        run: |
          mkdir -p out
          cp build/ipa/*.ipa out/ 2>/dev/null || true
          if [ "$EXPORT_METHOD" = "unsigned" ]; then
            ditto -c -k --sequesterRsrc --keepParent build/App.xcarchive out/App.xcarchive.zip
          fi
          ls -lh out

      - name: Upload .ipa
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ env.EXPORT_METHOD }}-${{ github.run_number }}
          path: out/
          if-no-files-found: error

      - name: Логи и проект при ошибке
        if: failure()
        run: |
          mkdir -p diag
          cp -R ios diag/ios 2>/dev/null || true
          cp capacitor.config.json diag/ 2>/dev/null || true
          cp package.json diag/ 2>/dev/null || true
          npx cap doctor > diag/cap-doctor.txt 2>&1 || true
          ls -R diag | head -100

      - name: Upload диагностики
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diag-${{ github.run_number }}
          path: diag/
          if-no-files-found: ignore
