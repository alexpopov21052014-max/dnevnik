name: Publish PWA (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ["index.html", "manifest.webmanifest", "icons/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Собрать сайт
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          [ -f manifest.webmanifest ] && cp manifest.webmanifest dist/ || true
          [ -d icons ] && cp -R icons dist/ || true
          echo "готово: $(ls dist)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
